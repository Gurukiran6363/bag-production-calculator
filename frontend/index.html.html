<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bag Production Workspace</title>
    <style>
        /* Modern UI Style and Theme Variables */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #f0f4f8; 
            margin: 0; 
            padding: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 1. Login Overlay Filter Screen Layout */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-card h3 { margin-bottom: 25px; color: #1e3c72; font-size: 24px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 6px; }
        .input-group input { width: 93%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .input-group input:focus { border-color: #1e3c72; outline: none; }

        .login-btn {
            width: 100%; padding: 12px; background: #1e3c72; color: white; border: none;
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .login-btn:hover { background: #2a5298; }
        .login-error { color: #d9534f; font-size: 13px; margin-top: 15px; display: none; }

        /* 2. Main Dashboard Layout Workspace */
        .main-workspace {
            display: none; /* Hidden until valid log verification takes place */
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin: 20px;
        }

        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f0f4f8; padding-bottom: 15px; margin-bottom: 25px; }
        .header-bar h2 { margin: 0; color: #333; }
        .logout-btn { padding: 8px 14px; background: #eef2f7; border: 1px solid #ccd1d9; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .logout-btn:hover { background: #e0e6ed; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field label { font-weight: 600; color: #4a5568; display: block; margin-bottom: 6px; font-size: 13px; }
        .field input { width: 90%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        
        .calc-btn { grid-column: span 2; width: 100%; padding: 14px; background: #2b6cb0; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .calc-btn:hover { background: #2c5282; }

        .result-box { margin-top: 30px; padding: 20px; background: #ebf8ff; border-left: 5px solid #3182ce; border-radius: 6px; display: none; }
        .result-title { font-weight: bold; color: #2b6cb0; margin-bottom: 15px; font-size: 17px; text-transform: uppercase; letter-spacing: 0.5px; }
        .result-box p { margin: 8px 0; color: #2d3748; font-size: 15px; }
    </style>
</head>
<body>

<!-- Login Authentication Filter Page -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h3>System Login</h3>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button class="login-btn" onclick="verifyCredentials()">Sign In</button>
        <div id="loginError" class="login-error">Invalid Username or Password!</div>
    </div>
</div>

<!-- Protected Core Calculator Application -->
<div id="mainWorkspace" class="main-workspace">
    <div class="header-bar">
        <h2>Bag Production Workspace</h2>
        <button class="logout-btn" onclick="triggerLogout()">Logout</button>
    </div>
    
    <div class="grid">
        <div class="field"><label>Bag Width (inches)</label><input type="number" id="bag_width" value="15"></div>
        <div class="field"><label>Bag Height (inches)</label><input type="number" id="bag_height" value="20"></div>
        <div class="field"><label>Number of Bags</label><input type="number" id="num_bags" value="100"></div>
        <div class="field"><label>Fabric Panna (inches)</label><input type="number" id="panna" value="40"></div>
        <div class="field"><label>Top Allowance (inches)</label><input type="number" id="top_allowance" value="1"></div>
        <div class="field"><label>Side Allowance (inches)</label><input type="number" id="side_allowance" value="1"></div>
        <div class="field"><label>Handle Length (inches)</label><input type="number" id="handle_length" value="12"></div>
        <div class="field"><label>Handle Width (inches)</label><input type="number" id="handle_width" value="1.5"></div>
        <div class="field"><label>Handles per Bag</label><input type="number" id="handles_per_bag" value="2"></div>
        <div class="field"><label>Cost per Meter (₹)</label><input type="number" id="cost_per_meter" value="45"></div>
        <button class="calc-btn" onclick="runCalculation()">Run Production Analytics</button>
    </div>

    <div id="results" class="result-box">
        <div class="result-title">🎯 Optimal Production Analytics</div>
        <p id="best_style"></p>
        <p id="total_meters"></p>
        <p id="total_cost"></p>
        <p id="cost_per_bag"></p>
    </div>
</div>

<script>
// 1. Frontend Login Check System
function verifyCredentials() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    const errorMsg = document.getElementById("loginError");

    // Set your own desired Username and Password combinations right here:
    if (user === "admin" && pass === "guru123") {
        errorMsg.style.display = "none";
        document.getElementById("loginOverlay").style.opacity = "0";
        setTimeout(() => {
            document.getElementById("loginOverlay").style.visibility = "hidden";
            document.getElementById("mainWorkspace").style.display = "block";
        }, 400);
    } else {
        errorMsg.style.display = "block";
    }
}

function triggerLogout() {
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("mainWorkspace").style.display = "none";
    document.getElementById("loginOverlay").style.visibility = "visible";
    document.getElementById("loginOverlay").style.opacity = "1";
}

// 2. Core Operational Pipeline Integration
function runCalculation() {
    const payload = {
        bag_width: parseFloat(document.getElementById("bag_width").value) || 0,
        bag_height: parseFloat(document.getElementById("bag_height").value) || 0,
        num_bags: parseInt(document.getElementById("num_bags").value) || 0,
        panna: parseFloat(document.getElementById("panna").value) || 0,
        top_allowance: parseFloat(document.getElementById("top_allowance").value) || 0,
        side_allowance: parseFloat(document.getElementById("side_allowance").value) || 0,
        handle_length: parseFloat(document.getElementById("handle_length").value) || 0,
        handle_width: parseFloat(document.getElementById("handle_width").value) || 0,
        handles_per_bag: parseInt(document.getElementById("handles_per_bag").value) || 0,
        cost_per_meter: parseFloat(document.getElementById("cost_per_meter").value) || 0
    };

    fetch("https://onrender.com", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === "success") {
            document.getElementById("results").style.display = "block";
            document.getElementById("best_style").innerHTML = `<b>Recommended Cut:</b> ${data.recommendation.best_style}`;
            document.getElementById("total_meters").innerHTML = `<b>Total Fabric Volume:</b> ${data.recommendation.total_meters.toFixed(2)} METERS`;
            document.getElementById("total_cost").innerHTML = `<b>Project Budget:</b> ₹${data.recommendation.total_cost.toFixed(2)}`;
            document.getElementById("cost_per_bag").innerHTML = `<b>Unit Manufacturing Cost:</b> ₹${data.recommendation.average_cost_per_bag.toFixed(2)}`;
        } else {
            alert("Calculation error reported by server: " + data.message);
        }
    })
    .catch(err => {
        console.error(err);
        alert("Failed connecting to host API layout. Please wait a moment for the server instance to run.");
    });
}
</script>
</body>
</html>
